name: Loon Finance
description: >-
  Loon is a Calgary-based fintech and the issuer of CADC, a regulated, fiat-backed
  stablecoin pegged 1:1 to the Canadian dollar. Reserves are held in segregated cash
  deposits at ATB Financial and attested independently every month by HDCPA
  Professional Corporation, with FINTRAC compliance and a prospectus pre-filed with
  the Alberta Securities Commission. CADC is issued on Ethereum, Base, Polygon,
  Arbitrum, Linea, and Solana, and Loon acquired the token from Paytrie (launched
  2021, $200M+ in cumulative volume). Loon publishes a small public, unauthenticated
  Transparency API exposing live circulating supply per chain, on-chain issuance
  (mint) events, and the monthly reserve-attestation history, backed by an
  llms.txt, a security.txt disclosure policy, and a public transparency dashboard.
