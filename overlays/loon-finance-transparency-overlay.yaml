overlay: 1.0.0
info:
  title: API Evangelist enhancements for Loon CADC Transparency API
  version: 1.0.0
extends: openapi/loon-finance-transparency-openapi.yml
actions:
  - target: $.info
    update:
      x-apievangelist-rating: 3
      x-apievangelist-notes: >-
        Public read-only stablecoin transparency API (supply, issuances, reserve
        attestations). No auth, no idempotency, simple limit/offset pagination,
        message-only error envelope. Spec generated by API Evangelist from
        loon.finance/llms.txt and verified live responses.
      x-api-category: fintech/stablecoin/transparency
  - target: $.info
    update:
      x-agentic-access:
        default-action-class: connected
        note: All operations are safe reads; suitable for autonomous agent consumption.
